[package]
name = "plan9-cmd"
version = "0.1.0"
edition = "2021"
description = "Plan 9 user-space commands, ported to Rust and built for the bare-metal x86_64 kernel"

[lib]
name = "cmd"
path = "src/lib.rs"

# The classic Plan 9 /bin + /rc/bin command set.  Each binary is a thin
# no_std entry stub around a module in src/lib.rs.
[[bin]]
name = "rc"
path = "src/bin/rc.rs"

[[bin]]
name = "echo"
path = "src/bin/echo.rs"

[[bin]]
name = "pwd"
path = "src/bin/pwd.rs"

[[bin]]
name = "ls"
path = "src/bin/ls.rs"

