[package]
name = "plan9-kernel"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
panic-smoke = []

[dependencies]
plan9-common = { path = "../common", features = ["alloc"] }
plan9-arch = { path = "../arch" }
plan9_drivers = { path = "../drivers" }
plan9-fs = { path = "../fs" }
spin = "0.9"
bitflags = { version = "2.13.0", default-features = false }
aes = { version = "0.8.4", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }
smoltcp = { version = "0.13.1", default-features = false, features = [
    "alloc", "auto-icmp-echo-reply", "iface-max-addr-count-8", "iface-max-route-count-16",
    "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6-slaac",
    "socket-dhcpv4", "socket-dns", "socket-icmp", "socket-raw", "socket-tcp", "socket-udp",
] }

[build-dependencies]
cc = "1"

[[bin]]
name = "plan9_kernel"
path = "src/main.rs"
