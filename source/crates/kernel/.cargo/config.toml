[build]
# No hardcoded target: build with `cargo build --target <triple>` for
# x86_64-unknown-none, aarch64-unknown-none, riscv64imac-unknown-none-elf, or
# loongarch64-unknown-none.

[target.x86_64-unknown-none]
runner = "none"
rustflags = [
  "--cfg", "aes_force_soft",
  "-C", "relocation-model=static",
  "-C", "panic=abort",
  "-C", "force-frame-pointers=yes",
]

[target.aarch64-unknown-none]
runner = "none"
rustflags = [
  "-C", "relocation-model=static",
  "-C", "panic=abort",
  "-C", "force-frame-pointers=yes",
]

[target.riscv64imac-unknown-none-elf]
runner = "none"
rustflags = [
  "-C", "relocation-model=static",
  "-C", "panic=abort",
  "-C", "force-frame-pointers=yes",
]

[target.loongarch64-unknown-none]
runner = "none"
rustflags = [
  "-C", "relocation-model=static",
  "-C", "panic=abort",
  "-C", "force-frame-pointers=yes",
]
