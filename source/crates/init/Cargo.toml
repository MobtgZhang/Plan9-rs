[package]
name = "plan9-init"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "plan9_init"
path = "src/main.rs"

[[bin]]
name = "bash"
path = "src/bash.rs"

[[bin]]
name = "ssh"
path = "src/ssh.rs"

[dependencies]
plan9-net = { path = "../net" }
plan9-common = { path = "../common", features = ["alloc"] }

[profile.dev]
panic = "abort"
